name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            title: Windows
            runs-on: windows-latest
            artifact_path: export/release/windows/bin
            artifact_name: windowsBuild

          - target: macos
            title: macOS
            runs-on: macos-15
            artifact_path: Template.tar.gz
            artifact_name: macOSBuild

          - target: linux
            title: Linux
            runs-on: ubuntu-latest
            artifact_path: Template.tar.gz
            artifact_name: linuxBuild

          - target: html5
            title: HTML5
            runs-on: ubuntu-latest
            artifact_path: export/release/html5/bin
            artifact_name: html5Build

          - target: android
            title: Android
            runs-on: ubuntu-latest
            artifact_path: export/release/android/bin/app/build/outputs/apk/debug
            artifact_name: androidBuild

          - target: ios
            title: iOS
            runs-on: macos-15
            artifact_path: export/release/ios/build/Release-iphoneos/*.ipa
            artifact_name: iOSBuild

    name: build${{ matrix.title }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Android NDK
        if: matrix.target == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Previous Cache
        id: cache-build-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            .haxelib/
            export/release/${{ matrix.target }}/haxe/
            export/release/${{ matrix.target }}/obj/
          key: cache-${{ matrix.target }}-release

      - name: Installing Libraries
        run: haxe --interp -cp ./actions/libs-installer -D analyzer-optimize -main Main

      - name: Setup Lime (Android)
        if: matrix.target == 'android'
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile
        run: |
          ${{ matrix.target == 'android' && 'haxelib run lime setup android' || '' }}
          haxelib run lime build ${{ matrix.target }} ${{ matrix.target == 'ios' && '-nosign' || '' }}

      - name: Clear Previous Cache
        uses: actions/github-script@v9
        with:
          script: await require('./actions/cache/clear-cache.js')({github, context}, 'cache-${{ matrix.target }}-release');

      - name: Save Current Cache
        id: cache-build-save
        uses: actions/cache/save@v6
        with:
          path: |
            .haxelib/
            export/release/${{ matrix.target }}/haxe/
            export/release/${{ matrix.target }}/obj/
          key: cache-${{ matrix.target }}-release

      - name: Tar files (macOS/Linux)
        if: matrix.target == 'macos' || matrix.target == 'linux'
        run: tar -zcvf Template.tar.gz -C export/release/${{ matrix.target }} bin

      - name: Create IPA Package (iOS)
        if: matrix.target == 'ios'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r Template-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}